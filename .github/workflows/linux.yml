name: Linux native release
on:
  workflow_dispatch:
    inputs:
      source_ref: {description: Source commit, required: true, default: main, type: string}
      inputs_release: {description: Temporary private draft inputs, required: true, type: string}
      inputs_sha256: {description: Input archive SHA-256, required: true, type: string}
      version: {description: Package version, required: true, default: enhanced-v1.0.2, type: string}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      INPUTS_RELEASE: ${{ inputs.inputs_release }}
      INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive, ref: '${{ inputs.source_ref }}'}
      - name: Fetch private native code and music
        run: python3 tools/fetch_private_inputs.py "$GITHUB_REPOSITORY" "$INPUTS_RELEASE" "$INPUTS_SHA256" "$RUNNER_TEMP/native-inputs.tar.gz"
      - name: Install graphics and audio build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev libdecor-0-dev xvfb
      - name: Build static SDL3
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git platform-deps/SDL
          cmake -S platform-deps/SDL -B platform-deps/sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DCMAKE_INSTALL_PREFIX="$PWD/platform-deps/sdl-install"
          cmake --build platform-deps/sdl-build --parallel 4
          cmake --install platform-deps/sdl-build
      - name: Build native game and verify host behavior
        run: |
          cmake -S . -B platform-deps/game-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE='-O2 -DNDEBUG' -DCMAKE_PREFIX_PATH="$PWD/platform-deps/sdl-install" -DCMAKE_DISABLE_FIND_PACKAGE_Freetype=ON -DSNESRECOMP_SDL_BACKEND=SDL3 -DSC_PROGRAM=ON -DSC_AOT=OFF -DSC_INTERPRETER_REFERENCE=OFF -DSC_LTO=OFF
          cmake --build platform-deps/game-build --parallel 4 --target UrbanRecomp sc_video_test sc_renderer_test sc_scroll_renderer_test sc_terrain_test UrbanRecompSetupLandTest UrbanRecompLandSaveTest UrbanRecompDebugGiftTest UrbanRecompPcmTest UrbanRecompMobileInputTest
          ctest --test-dir platform-deps/game-build -R '^simcity_(video|renderer|scroll_renderer|deferred_terrain|mobile_input)$' --output-on-failure
          platform-deps/game-build/UrbanRecompSetupLandTest
          platform-deps/game-build/UrbanRecompLandSaveTest
          platform-deps/game-build/UrbanRecompDebugGiftTest
          platform-deps/game-build/UrbanRecompPcmTest music/restored
      - name: Package and verify startup
        run: |
          python3 tools/package_linux.py "$PACKAGE_VERSION" --build-dir platform-deps/game-build --sdl-dir platform-deps/SDL
          app="$PWD/dist/UrbanRecomp-$PACKAGE_VERSION-linux-x64"
          mkdir -p "$RUNNER_TEMP/startup-data"
          set +e
          URBANRECOMP_HOME="$RUNNER_TEMP/startup-data" "$app/urbanrecomp" --no-settings > "$RUNNER_TEMP/startup.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/startup.log"
          test "$status" -eq 1
          grep -q 'no ROM' "$RUNNER_TEMP/startup.log"
          file "$app/UrbanRecomp" | grep -q 'ELF 64-bit.*x86-64'
          gh release upload "$INPUTS_RELEASE" "dist/UrbanRecomp-$PACKAGE_VERSION-linux-x64.tar.gz" "dist/UrbanRecomp-$PACKAGE_VERSION-linux-x64.tar.gz.sha256" --repo "$GITHUB_REPOSITORY"
      - name: Remove private inputs
        if: always()
        run: python3 -c "import shutil; from pathlib import Path; [shutil.rmtree(p,ignore_errors=True) for p in ('src/program_gen','music/restored')]; Path('$RUNNER_TEMP/native-inputs.tar.gz').unlink(missing_ok=True)"
